name: Preservation loan book tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OHCS_CSV: ${{ github.workspace }}/Oregon_Affordable_Housing_Inventory_20261002.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/preservation-loan-book/scripts/requirements.txt
      - run: python skills/preservation-loan-book/scripts/tests/run_tests.py
