# Dataset schemas for the oregon-portland pack (preservation-loan-book).
# Parsed by scripts/plb/schema.py. Declared date formats win: a column declared here is never re-tested row by row.
# Add a dataset by copying a block and declaring every date column; an undeclared date column makes the adapter stop
# with "No Format Declared" and the user runs scripts/date_profile.py to propose a format.
#
# Verified against Oregon_Affordable_Housing_Inventory_20261002.csv (1,819 rows, 53 columns, BOM): Financial_Closing_Date
# is day-first (222 values with first field > 12, zero with second field > 12); every other slash column is month-first
# (e.g. LATEST 0 vs 764); USDA_RD_Expiration_Date is '2038 Nov 17 12:00:00 AM'. Rehab Year is stored as '2,021'-style
# strings in 99 rows; the `numeric` block strips the comma.
#
# Blocks marked `verified_live: false` describe files no researcher opened in this build: their match_columns and field
# names come from layout snippets and must be confirmed from the live header. The agency_servicing_extract block is a
# design proposal (no real extract existed); confirm it against the first real export with date_profile.py.
#
# Keys (see _template/dataset-schemas.yaml for the full key list): match_columns, match_any (NEW: list of {any: [...]}
# groups; a block matches when every match_columns entry and at least one column of every group are present), encoding,
# key, dates, derived_events, validations, normalize, numeric, filters, county_fips, lead_columns (NEW: source column ->
# lead column map), enums (NEW: per-column allowed values), required_by_kind (NEW: agency_servicing_extract validation).

agency_servicing_extract:
  # The agency's own loan / grant / owned-asset / administered-contract ledger. RECORDED for the agency's own book.
  # Run FIRST (ingest_servicing_extract.py) so every later adapter can match property ids against the book.
  match_columns: ["book_kind", "program"]
  match_any:
    - {any: ["agency_loan_id", "grant_id", "asset_id", "contract_id"]}
    - {any: ["maturity", "affordability_end", "recapture_end", "contract_expiration"]}
    - {any: ["ohcs_property_key", "parcel_id", "address", "property_id"]}
  encoding: utf-8-sig
  key: ["book_kind", "agency_loan_id", "grant_id", "asset_id", "contract_id"]
  verified_live: false   # design proposal; no real extract in this build
  source_id: agency_servicing
  default_basis: RECORDED
  required_by_kind:
    loan: ["agency_loan_id", "upb", "maturity"]
    grant: ["grant_id", {any: ["affordability_end", "recapture_end"]}]
    owned_asset: ["asset_id", "units_assisted", {any: ["affordability_end", "contract_expiration"]}]
    administered_contract: ["contract_id", "contract_expiration", "units_assisted"]
  dates:
    origination_date:                 {format: iso, basis: RECORDED}
    maturity:                         {format: iso, basis: RECORDED, event: AGENCY_LOAN_MATURITY, when_kind: [loan]}
    affordability_end:                {format: iso, basis: RECORDED, event: AFFORDABILITY_PERIOD_END, program_from: program}
    contract_expiration:              {format: iso, basis: RECORDED, event: HAP_EXPIRATION, confidence: 0.90, when_kind: [administered_contract], program_from: program}
    recapture_start:                  {format: iso, basis: RECORDED}
    recapture_end:                    {format: iso, basis: RECORDED, event: GRANT_RECAPTURE_END}
    senior_maturity:                  {format: iso, basis: REPORTED, event: LOAN_MATURITY, detail_from: senior_lien_type, detail_prefix: "lender_type="}
    notice_received_date:             {format: iso, basis: RECORDED, event: PRESERVATION_NOTICE_RECEIVED, when: "notice_log_status == received", detail_from: notice_detail, needs_anchor_when_blank: true}
    qc_request_date:                  {format: iso, basis: RECORDED}
    qc_request_complete_date:         {format: iso, basis: RECORDED, event: QC_ELIGIBILITY, status: requested, when: "qc_waived != true"}
    third_party_offer_mailed_date:    {format: iso, basis: RECORDED, event: THIRD_PARTY_OFFER_RECEIVED}
    third_party_offer_received_date:  {format: iso, basis: RECORDED}
    qp_offer_delivered_date:          {format: iso, basis: RECORDED}   # qualified purchaser's offer delivered -> ROFR_RECORDABLE_DATE (+30 d, ORS 456.262, verify)
    usda_prepay_request_date:         {format: iso, basis: RECORDED, event: USDA_PREPAY_REQUEST_RECEIVED}
    rad_chap_date:                    {format: iso, basis: RECORDED, event: RAD_CHAP}
    section_18_application_date:      {format: iso, basis: RECORDED, event: SECTION_18_APPLICATION}
    last_inspection_date:             {format: iso, basis: RECORDED}
    last_8823_date:                   {format: iso, basis: RECORDED, event: NONCOMPLIANCE_FINDING, detail: "8823_filed"}
    last_reac_date:                   {format: iso, basis: RECORDED}
    as_of:                            {format: iso, basis: RECORDED}
  derived_events:
    # Derived here by the adapter; the AGENCY_DEADLINE helpers that depend on these are emitted by plb/agency_calendar.py
    # using the parameters in market-params.json (qc_response_months, rofr_match_days, records_request_after_notice_days,
    # usda_public_body_offer_days, inspection_cadence_*).
    COVENANT_DEFAULT:          {when: "covenant_status == default", date: as_of, basis: RECORDED}
    SHARED_APPRECIATION_DUE:   {when: "shared_appreciation_pct > 0", from: maturity, basis: RECORDED}
    QC_REQUEST_INELIGIBLE:     {when: "qc_waived == true and (qc_request_date or qc_request_complete_date)", date: qc_request_date, basis: RECORDED}
    NONCOMPLIANCE_FINDING:     {when: "open_findings_count > 0", date: as_of, basis: RECORDED, detail: "open_finding", value_from: open_findings_count}
    REAC_SCORE:                {when: "last_reac_score present", date: last_reac_date, basis: RECORDED, value_from: last_reac_score}
  numeric:
    float_columns: ["upb", "accrued_interest", "rate", "recapture_amount", "shared_appreciation_pct", "senior_upb"]
    int_columns: ["units_assisted", "open_findings_count", "last_reac_score", "lien_position"]
  enums:
    book_kind: [loan, grant, owned_asset, administered_contract]
    program: [LIHTC_9, LIHTC_4, HAP, PRAC, RAC, PAC, PBV, HUD_INSURED, HUD_236, HUD_202_811, USDA_515, HOME, CDBG, OAHTC, GHAP, HDGP, LIFT, HTF, OTHER_OHCS, LOCAL_REG, PHB_LOAN, TIF, LEVY, IH_SET_ASIDE]
    rate_type: [fixed, variable]
    payment_type: [hard_pay, residual_receipts, deferred, forgivable]
    recapture_type: [home_recapture, home_resale, home_rental_repayment, cdbg, shared_appreciation, none]   # home_recapture / home_resale = homebuyer (92.254); rental HOME = home_rental_repayment (92.503(b))
    recapture_method: [full, prorata_reducing, forgiveness_schedule, cdbg_fmv_share, none]
    covenant_status: [current, watch, default, cured, released]
    senior_lien_type: [hud_fha, usda_rd, fannie_dus, freddie_k_sb, bank_cu, state_soft, local_soft, none, unknown]
    notice_log_status: [received, not_received_confirmed, unknown]
    notice_detail: [push_first, push_second, hap_optout]
    tenant_notice_status: [confirmed, not_confirmed, unknown, "n/a_pre_operative"]
    hap_renewal_request_status: [received, not_received, unknown]
    hap_renewal_option: ["1a", "1b", "2", "3", "4", "5", "6_optout", unknown]
    qc_waived: ["true", "false", unknown]
    recap_status: [none, announced, under_application, closed]
    notice_address_source: [regulatory_agreement, hap_contract, loan_docs, sos_registered_agent, unknown]
    basis: [RECORDED, REPORTED, DERIVED, ESTIMATED, PROXY]
  optional_columns: ["grant_id", "asset_id", "contract_id", "property_name", "address", "city", "zip", "county_fips", "parcel_id", "property_id", "ohcs_property_key",
                     "units_assisted", "accrued_interest", "rate", "rate_type", "payment_type", "origination_date", "recapture_type", "recapture_method", "recapture_amount",
                     "recapture_start", "recapture_end", "covenant_status", "lien_position", "coterminous_with", "shared_appreciation_pct", "senior_lien_type", "senior_maturity",
                     "senior_upb", "notice_log_status", "notice_received_date", "notice_detail", "tenant_notice_status", "hap_renewal_request_status", "hap_renewal_option",
                     "qc_request_date", "qc_request_complete_date", "qc_waived", "third_party_offer_mailed_date", "third_party_offer_received_date", "qp_offer_delivered_date", "usda_prepay_request_date",
                     "rad_chap_date", "section_18_application_date", "last_inspection_date", "open_findings_count", "last_8823_date", "last_reac_score", "last_reac_date",
                     "apps_flag", "recap_status", "notice_address", "notice_address_source", "am_officer", "am_officer_email", "basis", "as_of"]
  pii:
    never: []                                  # the extract carries no NEVER columns by design; any owner_phone / owner_email column found is dropped at write
    internal_only: ["am_officer_email"]
  book_join:
    crosswalk_file: book_crosswalk.csv
    fuzzy_ratio_min: 0.92
    phase_tokens: ["I", "II", "III", "IV", "A", "B", "C", "1", "2", "3", "Phase"]

ohcs_affordable_housing_inventory:
  match_columns: ["Property Name", "LATEST_Expiration_Date", "Financial_Closing_Date"]
  encoding: utf-8-sig
  key: ["Property Name", "Address"]
  verified_live: true   # file on disk, pattern-tested; the data.oregon.gov page itself was not fetched
  dates:
    Financial_Closing_Date:     {format: "%d/%m/%Y", basis: REPORTED}
    Compliance_Start_Date:      {format: "%m/%d/%Y", basis: REPORTED}
    LIHTC_4_Expiration_Date:    {format: "%m/%d/%Y", basis: REPORTED, event: LIHTC_EXTENDED_USE_END, program: LIHTC_4}
    LIHTC_9_Expiration_Date:    {format: "%m/%d/%Y", basis: REPORTED, event: LIHTC_EXTENDED_USE_END, program: LIHTC_9}
    HOME_Expiration_Date:       {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: HOME}
    OAHTC_Expiration_Date:      {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: OAHTC}
    GHAP_Expiration_Date:       {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: GHAP}
    HDGP_Expiration_Date:       {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: HDGP}
    LIFT_Expiration_Date:       {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: LIFT}
    HTF_Expiration_Date:        {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: HTF}
    Other_OHCS_Expiration_Date: {format: "%m/%d/%Y", basis: REPORTED, event: SOFT_PROGRAM_END, program: OTHER_OHCS}
    # HAP_EXPIRATION: program stamped from HUD_CONTRACT_TO_PROGRAM["HUD Contract"]; detail term_unknown_annual_assumed when OHCS is the
    # only source; a date already past as_of with no termination evidence -> status STALE_CONTRACT_DATE (never OVERDUE, never lost,
    # no agency deadlines). The HUD MF Assistance tape overrides this column when both exist.
    HUD_MF_Expiration_Date:     {format: "%m/%d/%Y", basis: REPORTED, event: HAP_EXPIRATION, confidence: 0.70, program_from: "HUD Contract", program_map: hud_contract_to_program, detail: term_unknown_annual_assumed, stale_if_past: true}
    USDA_RD_Expiration_Date:    {format: "%Y %b %d %I:%M:%S %p", basis: REPORTED, event: USDA_515_MATURITY}
    LATEST_Expiration_Date:     {format: "%m/%d/%Y", basis: REPORTED, event: REGULATORY_LATEST_END, recompute_if_blank: max_of_components}
  derived_events:
    LIHTC_COMPLIANCE_END:        {from: Compliance_Start_Date, add_years: 15, basis: DERIVED, window_months: 12, require_programs: [LIHTC_4, LIHTC_9]}
    # PROXY mini-perm maturity is OPT-IN (--include-proxies, default false): the agency's own book supplies RECORDED maturities and a
    # RECORDED AGENCY_LOAN_MATURITY on the same property drops this event at merge.
    LOAN_MATURITY:               {from: Financial_Closing_Date, add_years: 15, add_years_if_program: {LIHTC_4: 17}, basis: PROXY, window_months: 36, opt_in_flag: include_proxies, derivation: "Financial_Closing_Date + 15y mini-perm (17y 4% bond)"}
  # PuSH windows and agency deadlines are NOT derived here. The adapter emits the owner-side REPORTED/DERIVED events above plus the
  # withdrawal-anchor inputs; plb/agency_calendar.py derives withdrawal_anchor_date (restriction-type ends only; HAP/PRAC only with a
  # non-renewal signal), both PRESERVATION_NOTICE_WINDOW rows and every AGENCY_DEADLINE event from market-params.json parameters.
  push:
    windows_months_before_anchor: [[36, 30], [30, 24]]
    due_dates: {PUSH_WINDOW_PREP: 36, PUSH_FIRST_NOTICE_DUE: 30, PUSH_SECOND_NOTICE_DUE: 24}
    min_units: 5
    require_programs: push_covered
    anchor_rule: withdrawal_anchor_date
    # 36..30 is an INTERNAL prep window: no statutory 36-month owner-notice start was found. OAR 813-115-0030 (summary) reads "no sooner than 30 and
    # at least 24 months" before withdrawal; ORS 456.262 ties the withdrawal bar to 30 months after (1) notices / 24 months after (2) notices and lets
    # OHCS appoint a designee after the owner's notice OR 30 months before expiry, whichever is earlier. ORS 456.260 text unread; verify before quoting.
    derivation: "withdrawal_anchor_date - 36..30 months (internal prep window) / 30..24 months (owner notice no sooner than 30, at least 24 months before withdrawal; OAR 813-115-0030 summary; ORS 456.260 unread)"
    program_coverage_param: push_program_coverage_verified   # false -> HOME-only / LIHTC-only rows carry Verify — PuSH Coverage (OAR 813-115-0010 program list unread)
  validations:
    - {rule: month_le_12, on_fail: "Rejected — Out of Range"}
    - {rule: latest_equals_max_components, whitelist: ["Casa Sonada 4", "Riverside Terrace"], on_fail: "Verify — Conflicting Sources"}
    - {rule: expiration_ge_compliance_start, when_both_present: true, on_fail: "Verify — Conflicting Sources"}
    - {rule: compliance_start_within_months_after_closing, months: 36, when_both_present: true, on_fail: "Verify — Conflicting Sources"}
  normalize:
    County: title_case
    City: {title_case: true, typo_map: {Portalnd: Portland}}
    "Owner Type": {title_case: true, map: {Profit: For-Profit, "Non-profit": Non-Profit, Government: Government}, blank: infer_from_owner_name}
    "Property Type": {drop_values: ["0", "ERROR: #N/A"]}
    "OHCS Funded?": {map: {"true": true, "True": true, "TRUE": true, "false": false, "False": false, "FALSE": false}}
  numeric:
    # strip thousands separators and cast to int when integral ('2,021' -> 2021; '35.0' -> 35)
    int_columns: ["Rehab Year", "Year Built", "Total Units", "Total_30_AMI_Units", "Total_40_AMI_Units", "Total_50_AMI_Units",
                  "Total_60_AMI_Units", "Total_80_AMI_Units", "Market_Rate_Units", "Rental_Assistance_Count", "PSH_Units",
                  "Total_SRO_Units", "Total_Efficiency_Units", "Total_1_BR_Units", "Total_2_BR_Units", "Total_3_BR_Units", "Total_4Plus_BR_Units",
                  "No_Accessible_Units", "Visitable_Units", "No_Income"]
  lead_columns:
    # source column -> lead column (plb/units.py reads these to compute restricted_units, units_at_risk, hap/prac/other_ra, psh, family_3br_plus_units)
    PSH_Units: psh_units_at_risk
    "OHCS Funded?": ohcs_funded
    "Scattered/Single Site": site_type
    Rental_Assistance_Count: rental_assistance_units      # split into hap_units_at_risk / prac_units_at_risk / other_ra_units by HUD Contract
    Market_Rate_Units: market_rate_units
    "Total Units": units
    Total_3_BR_Units: family_3br_units
    Total_4Plus_BR_Units: family_4plus_br_units
    "Property Type": property_type
    "OR House District": or_house_district
    "OR Senate District": or_senate_district
    "Congressional District": congressional_district
  vulnerability_flags:
    # Property Type tokens -> vulnerability_flags entries; PSH_Units > 0 -> psh
    elderly: ["Elderly Apartments", "Elderly-Disabled"]
    disabled: ["Elderly-Disabled", "Disabled Apartments", "Disabled"]
    veteran: ["Veteran Housing"]
    sro: ["Single Room Occupancy"]
  filters:
    exclude: {Status: ["In Development"]}     # EXCLUDED with exclusion_reason in_development; listed under "Pipeline, not scored"
  value_proxy:
    # No market $/unit fallback in the agency tool. est_restricted_noi only when rent-limits.json is populated (recap sizing, our_book only).
    fallback: none
    rent_limits_file: rent-limits.json
  county_fips: {Multnomah: "41051", Washington: "41067", Clackamas: "41005", Columbia: "41009", Yamhill: "41071"}

hud_fhasl_active:
  match_columns: ["HUD Project Number", "Maturity Date", "Section of the Act"]
  verified_live: false
  dates: {"Initial Endorsement Date": {format: excel_date}, "Final Endorsement Date": {format: excel_date}, "Maturity Date": {format: excel_date, basis: RECORDED, event: LOAN_MATURITY}}
  derived_events: {PREPAY_WINDOW_OPEN: {from: "Final Endorsement Date", add_years: 10, basis: DERIVED, window_months: 6}}
  soa_affordable_codes: ["236", "221(d)(3)", "202", "811", "542"]
  lead_columns: {senior_lien_type: hud_fha, "Amortized UPB": senior_upb, "Maturity Date": senior_maturity}   # for the coterminous_senior_cliff test; no refi test, no assumable flag

hud_mf_assistance_sec8:
  match_columns: ["property_id", "tracs_overall_expiration_date"]
  verified_live: false
  dates: {tracs_effective_date: {format: excel_date}, tracs_overall_expiration_date: {format: excel_date, basis: REPORTED, event: HAP_EXPIRATION, confidence: 0.70, overrides: ohcs_affordable_housing_inventory.HUD_MF_Expiration_Date, stale_if_past: true}}
  lead_columns: {assisted_units_count: hap_units_at_risk, is_hud_administered: pbca_flag, owner_organization_name: owner_name, mgmt_agent_org_name: manager_name}
  optional_columns: ["hap_renewal_request_status", "hap_renewal_option"]   # when the CA export carries them
  pii: {never: ["owner_main_phone_number_text", "owner_phone", "owner_email"]}  # alias may stay for join; never written

hud_reac_scores:
  # HUD Multifamily Physical Inspection Scores export (normalize_reac_scores.py). Field names from the data dictionary snippet; verify on first pull.
  match_columns: ["property_id", "inspection_score", "inspection_date"]
  verified_live: false
  dates: {inspection_date: {format: excel_date, basis: REPORTED, event: REAC_SCORE, value_from: inspection_score, detail_from: inspection_protocol}}
  numeric: {int_columns: ["inspection_score"]}
  derived: {decline_ge_15: "detail decline_ge_15 when the prior score for the same property is >= 15 points higher"}

ohcs_push_forecast:
  # OHCS "Affordable Housing 10-Year Expiration Forecast" (data.oregon.gov; PuSH dashboard source). Field names are GUESSES from the
  # dataset description (never opened in this build); normalize_ohcs_forecast.py matches them through an alias table and names every
  # missing field. Run date_profile.py on the real export first. --prior writes status_flips.csv (the agency KPI diff).
  match_columns: ["Property Name", "Preservation Status"]
  verified_live: false
  key: ["Property Name", "Address"]
  dates:
    "Expiration Date": {format: "%m/%d/%Y", basis: REPORTED, event: REGULATORY_LATEST_END}
    "Notice Date":     {format: "%m/%d/%Y", basis: RECORDED, event: PRESERVATION_NOTICE_RECEIVED}
  status_map:
    notice_received: ["Notice Received", "First Notice Received", "Second Notice Received", "Owner Intends to Exit", "Opt-Out Notice", "Notice of Intent"]
    first_notice: ["First Notice Received", "Notice of Intent"]
    second_notice: ["Second Notice Received"]
    hap_optout: ["Opt-Out Notice"]
    at_risk: ["At Risk", "Monitoring", "Expiring"]
    preserved: ["Preserved", "Extended", "Resyndicated", "Stabilized"]
  lead_columns: {notice_status: notice_status, preservation_status: recap_status_hint}   # preserved -> recap_status closed (REPORTED evidence); notice -> received
  kpi_flags: [notice_filed, hap_renewed, preserved]
  signals: {on_state_expiring_list: true}

noah_candidates:
  # Optional NOAH watch input (references/noah-watch.md); manual CSV; only read with --noah-watch.
  match_columns: ["property_name", "address", "units", "est_rent"]
  verified_live: false
  dates: {maturity: {format: iso, basis: REPORTED, event: LOAN_MATURITY}}
  numeric: {int_columns: ["units", "year_built", "hold_years", "tax_delinquent_years", "code_cases_open"], float_columns: ["est_rent"]}
  derived: {HOLD_YEARS: {from: hold_years, basis: RECORDED}, TAX_DELINQUENT_YEARS: {from: tax_delinquent_years, basis: RECORDED}, rent_to_fmr_ratio: "est_rent / safmr[zip][bedroom] (market-params safmr block)"}
